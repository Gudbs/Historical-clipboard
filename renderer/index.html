<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <!-- 内容安全策略：禁止加载任何远程内容，纯本地运行 -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' clipimg: data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>剪贴板历史</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 顶部：搜索框 + 右侧独立的设置入口 -->
  <header class="topbar">
    <div class="topbar-inner">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input id="searchInput" type="text"
               placeholder="搜索文本内容、备注或文件名…"
               autocomplete="off" spellcheck="false">
      </div>
      <button id="settingsBtn" class="settings-btn" title="设置">⚙️</button>
    </div>
  </header>

  <!-- 记录列表 -->
  <main id="main">
    <div id="list" class="list"></div>
    <div id="empty" class="empty hidden">
      <div class="empty-icon">📋</div>
      <p class="empty-title">还没有剪贴板记录</p>
      <p class="empty-sub">去复制点文本、图片或文件试试</p>
    </div>
  </main>

  <!-- 备注编辑弹窗 -->
  <div id="remarkModal" class="modal-mask hidden">
    <div class="modal">
      <h3 class="modal-title">编辑备注</h3>
      <input id="remarkInput" class="modal-input" type="text"
             placeholder="给这条记录加个备注，方便以后搜索"
             autocomplete="off" spellcheck="false">
      <div class="modal-actions">
        <button id="remarkCancel" class="btn btn-ghost">取消</button>
        <button id="remarkSave" class="btn btn-primary">保存</button>
      </div>
    </div>
  </div>

  <!-- 编辑本条内容弹窗（改过内容后点「取消」会先弹「放弃修改」确认） -->
  <div id="editContentModal" class="modal-mask hidden">
    <div class="modal modal-wide">
      <h3 class="modal-title">编辑本条内容</h3>
      <!-- spellcheck="false"：只看纯文本，不显示红色波浪线的拼写错误提示 -->
      <textarea id="editContentInput" class="modal-textarea" rows="6"
                placeholder="修改这条记录原本的剪贴板文本内容…"
                autocomplete="off" autocorrect="off" autocapitalize="off"
                spellcheck="false" wrap="soft"></textarea>
      <div class="modal-actions">
        <button id="editContentCancel" class="btn btn-ghost">取消</button>
        <button id="editContentSave" class="btn btn-primary">保存</button>
      </div>
    </div>
  </div>

  <!-- 放弃修改确认弹窗（仅当编辑框内容有改动时出现） -->
  <div id="discardModal" class="modal-mask hidden">
    <div class="modal">
      <h3 class="modal-title">放弃修改</h3>
      <p class="modal-text">这条记录的内容已经改过但还没保存，确定不保留这次修改吗？</p>
      <div class="modal-actions">
        <button id="discardCancel" class="btn btn-ghost">继续编辑</button>
        <button id="discardOk" class="btn btn-danger">放弃修改</button>
      </div>
    </div>
  </div>

  <!-- 通用提示弹窗（风格与编辑备注一致，如：图片不支持编辑正文） -->
  <div id="noticeModal" class="modal-mask hidden">
    <div class="modal">
      <h3 class="modal-title">提示</h3>
      <p id="noticeText" class="modal-text"></p>
      <div class="modal-actions">
        <button id="noticeOk" class="btn btn-primary">确定</button>
      </div>
    </div>
  </div>

  <!-- 图片预览弹窗（点击图片缩略图打开，支持缩放） -->
  <div id="previewModal" class="modal-mask hidden">
    <div class="preview-wrap">
      <div class="preview-box">
        <img id="previewImg" class="preview-img" alt="图片预览" draggable="false">
      </div>
      <div class="preview-toolbar">
        <button id="zoomOut" class="btn btn-ghost" title="缩小">−</button>
        <span id="previewZoomText" class="preview-zoom-text">100%</span>
        <button id="zoomIn" class="btn btn-ghost" title="放大">＋</button>
        <button id="previewClose" class="btn btn-ghost">关闭</button>
      </div>
    </div>
  </div>

  <!-- 删除确认弹窗（「确定」为红色警告色） -->
  <div id="confirmModal" class="modal-mask hidden">
    <div class="modal">
      <h3 class="modal-title">删除记录</h3>
      <p class="modal-text">确定要删除这条记录吗？删除后不可恢复。</p>
      <div class="modal-actions">
        <button id="confirmCancel" class="btn btn-ghost">取消</button>
        <button id="confirmOk" class="btn btn-danger">确定</button>
      </div>
    </div>
  </div>

  <!-- 设置弹窗 -->
  <div id="settingsModal" class="modal-mask hidden">
    <div class="modal">
      <h3 class="modal-title">设置</h3>
      <div class="setting-row">
        <span class="setting-label">自动清理留存时长</span>
        <div class="retention-group">
          <select id="retentionSelect" class="select" title="选择记录保留多久后自动清理">
            <option value="1">1 天</option>
            <option value="3">3 天</option>
            <option value="custom">自定义</option>
          </select>
          <!-- 选「自定义」时才出现：可填 1 ~ 15 天 -->
          <span id="retentionCustomWrap" class="custom-days hidden">
            <input id="retentionCustomInput" class="days-input" type="number"
                   min="1" max="15" step="1" value="7"
                   title="自定义天数（1 ~ 15 天）" spellcheck="false">
            <span class="days-unit">天</span>
          </span>
        </div>
      </div>
      <div class="setting-row">
        <label class="setting-label switch-line">
          <input type="checkbox" id="autostartCheck"> 开机自动启动（常驻托盘）
        </label>
      </div>
      <div class="setting-row">
        <span class="setting-label">帮助文档</span>
        <div class="help-btns">
          <button id="helpReadme" class="btn btn-ghost" title="项目说明">README.md</button>
          <button id="helpTutorial" class="btn btn-ghost" title="零基础使用教程">教程.md</button>
        </div>
      </div>
      <div class="modal-actions">
        <button id="settingsClose" class="btn btn-primary">关闭</button>
      </div>
      <div id="versionLine" class="version-line" title="点击查看本版本的更新内容">
        v<span id="versionText"></span>
      </div>
    </div>
  </div>

  <!-- 更新说明弹窗（点击设置面板底部版本号打开） -->
  <div id="changelogModal" class="modal-mask hidden">
    <div class="modal modal-wide">
      <h3 class="modal-title">更新说明</h3>
      <div id="changelogBody" class="changelog"></div>
      <div class="modal-actions">
        <button id="changelogClose" class="btn btn-primary">关闭</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
